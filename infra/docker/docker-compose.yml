version: "3.9"

services:

  postgres:
    image: postgres:16
    container_name: postgres
    environment:
      POSTGRES_DB: paymentdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_BROKER_ID: 1
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1


  api-gateway:
    build:
      context: ../../
      dockerfile: platform/api-gateway/Dockerfile
    ports:
      - "8080:8080"


  auth-service:
    build:
      context: ../../
      dockerfile: platform/auth-service/Dockerfile
    ports:
      - "8081:8081"


  payment-service:
    build:
      context: ../../
      dockerfile: business/payment-service/Dockerfile
    ports:
      - "8082:8082"


  limit-service:
    build:
      context: ../../
      dockerfile: business/limit-service/Dockerfile
    ports:
      - "8083:8083"


  transaction-service:
    build:
      context: ../../
      dockerfile: business/transaction-service/Dockerfile
    ports:
      - "8084:8084"


  audit-service:
    build:
      context: ../../
      dockerfile: support/audit-service/Dockerfile
    ports:
      - "8085:8085"


  notification-service:
    build:
      context: ../../
      dockerfile: support/notification-service/Dockerfile
    ports:
      - "8086:8086"